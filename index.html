    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #080d1a;
            background-image:
              radial-gradient(circle at 10% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
              radial-gradient(circle at 90% 85%, rgba(244, 114, 182, 0.12) 0%, transparent 45%),

            color: #e2e8f0;
        }

        .container {
            text-align: center;
        }

        .links {
            margin-top: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #94a3b8;
            font-size: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 0 16px;
        }

        .links a {
            text-decoration: none;
            color: #f8fafc;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 500;
        }

        .links a:hover {
            color: #fff;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .links a.link-games:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .links a.link-projects:hover {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border-color: transparent;
        }

        .links a.link-essays:hover {
            background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
            border-color: transparent;
        }

        #chester-link {
            display: inline-block;
            width: min(400px, 85vw);
            max-width: 400px;
            transition: transform 0.2s ease;
            margin: 0 auto;
        }

        #chester-link img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 50%;
            /* Fixes the artifact dots at the corners of the original image */
            mask-image: radial-gradient(circle, white 100%, black 100%);
            -webkit-mask-image: -webkit-radial-gradient(circle, white 100%, black 100%);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 30px rgba(99, 102, 241, 0.2);
        }
