name: Send Daily Meow

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning push
        env:
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          PUSH_SENDER_TOKEN: ${{ secrets.PUSH_SENDER_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error --max-time 60 \
              -X POST "$PUSH_SERVER_URL/send-morning" \
              -H "Authorization: Bearer $PUSH_SENDER_TOKEN"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 15
          done
          exit 1
