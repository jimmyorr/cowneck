        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #1a1a1a;
            user-select: none;
        }

        .retro-text {
            font-family: 'VT323', ui-monospace, monospace;
        }

        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .station-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #78716c;
        }

        .station-btn:hover {
            color: #d97706;
        }

        .station-btn.active {
            background-color: rgba(68, 64, 60, 0.5);
            color: #d97706;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .mixer-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            background-color: rgba(41, 37, 36, 0.4);
            color: #78716c;
        }

        .mixer-btn.active {
            border-color: rgba(120, 113, 108, 0.2);
            background-color: rgba(68, 64, 60, 0.5);
            color: #d97706;
        }

        /* Cross-browser vertical range slider styling */
        .vertical-range {
            writing-mode: vertical-lr;
            direction: rtl;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .vertical-range:hover,
        .vertical-range:focus-visible {
            opacity: 1;
        }

        /* Hit Feedback Animation */
        .hit-feedback {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: inherit;
            font-style: italic;
            z-index: 100;
            animation: hit-float 0.8s ease-out forwards;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        @keyframes hit-float {
            0% {
                transform: translate(-50%, 0) scale(0.5);
                opacity: 0;
            }

            20% {
                transform: translate(-50%, -20px) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -100px) scale(1);
                opacity: 0;
            }
        }

        .score-pop {
            animation: score-pulse 0.3s ease-out;
        }

        @keyframes score-pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
                color: #fbbf24;
            }

            100% {
                transform: scale(1);
            }

    <script type="module">
        // Safe localStorage helpers (prevent SecurityError in sandboxed iframes / private browsing)
        const BEST_SCORE_KEY = 'lofi-best-score';

        function loadBestScore() {
            try {
                const raw = window.localStorage.getItem(BEST_SCORE_KEY);
                const parsed = Number.parseInt(raw ?? '0', 10);
                return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
            } catch {
                return 0;
            }
        }

        function saveBestScore(value) {
            try {
                window.localStorage.setItem(BEST_SCORE_KEY, String(value));

                // Ignore SecurityError / QuotaExceededError

            snare: null,

        const scheduleAheadTime = 0.1; // s

            { name: 'Cmaj9', offsets: [48, 52, 55, 59, 62] },
            { name: 'Am9', offsets: [45, 48, 52, 55, 59] },
            { name: 'Dm9', offsets: [50, 53, 57, 60, 64] },

                color: 'text-blue-500',
                progression: [5, 6, 1, 4], // Fmaj7 -> Em7 -> Am9 -> Am11
            },
            midnight: {
                name: 'Midnight Neon',
                bpm: 92,
                style: 'jazzy',
                color: 'text-purple-500',
                progression: [2, 7, 8, 3], // Dm9 -> Ebmaj7 -> Abmaj7 -> G13
            },
        };

        let currentStation = 'sunset';
        let currentChordIndex = 0;
        let chordProgression = [...stations.sunset.progression];

        // Mixer State
        const instrumentState = {
            kick: true,
            snare: true,
            hihat: true,
            chord: true,
        };
        const instrumentVolumes = {
            kick: 0.8,
            snare: 0.7,
            hihat: 0.8,
            chord: 0.7,
        };

        // Rhythm Game State
        let score = 0;
        let streak = 0;
        let bestScore = loadBestScore();
        let lastQuarterBeatTime = -1;
        let lastScoredBeatTime = -Infinity;

        // UI Elements
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const visualizerScreen = document.getElementById('visualizer-screen');
        const playBtn = document.getElementById('play-btn');

        const filterValEl = document.getElementById('filter-val');
        const crackleSlider = document.getElementById('crackle-slider');
        const crackleValEl = document.getElementById('crackle-val');
        const wobbleSlider = document.getElementById('wobble-slider');
        const wobbleValEl = document.getElementById('wobble-val');
        const chordDisplay = document.getElementById('chord-display');

        const helpContent = document.getElementById('help-content');
        let lastHelpTrigger = null;

        // Canvas HiDPI sizing (updated via ResizeObserver instead of per-frame layout reads)
        let canvasCssWidth = 0;
        let canvasCssHeight = 0;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasCssWidth = rect.width;
            canvasCssHeight = rect.height;
            const targetWidth = Math.max(1, Math.round(rect.width * dpr));
            const targetHeight = Math.max(1, Math.round(rect.height * dpr));
            if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }

        if (typeof window.ResizeObserver === 'function') {
            const ro = new window.ResizeObserver(resizeCanvas);
            ro.observe(canvas);
        } else {
            window.addEventListener('resize', resizeCanvas);
        }
        resizeCanvas();

        // Sync initial UI readouts
        function formatWobbleLabel(val) {
            const num = Number(val);
            if (num === 0) return 'Off';
            if (num <= 20) return 'Low';
            if (num <= 40) return 'Medium';
            return 'High';
        }

        function syncSliderLabels() {
            filterValEl.textContent = `${filterSlider.value}Hz`;
            crackleValEl.textContent = `${crackleSlider.value}%`;
            wobbleValEl.textContent = formatWobbleLabel(wobbleSlider.value);

        bestEl.textContent = String(bestScore).padStart(4, '0');
        syncSliderLabels();

        // Centralized channel gain helper (eliminates triplicated mixer gain math)
        function computeChannelGain(name) {
            if (!instrumentState[name]) return 0;
            const vol = instrumentVolumes[name];
            return name === 'chord' ? vol * 0.7 : vol;
        }

        function applyChannelGain(name, timeConstant = 0.03, immediate = false) {
            const node = mixerNodes[name];
            if (!node || !audioCtx) return;
            const target = computeChannelGain(name);
            node.gain.cancelScheduledValues(audioCtx.currentTime);
            if (immediate) {
                node.gain.setValueAtTime(target, audioCtx.currentTime);
            } else {
                node.gain.setTargetAtTime(target, audioCtx.currentTime, timeConstant);
            }
        }

        function shuffleInPlace(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function makeDistortionCurve(amount = 50) {
            const k = typeof amount === 'number' ? amount : 50;
            const nSamples = 44100;
            const curve = new Float32Array(nSamples);
            const deg = Math.PI / 180;
            for (let i = 0; i < nSamples; i++) {
                const x = (i * 2) / nSamples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        // --- Audio Engine Setup ---

        async function initAudio() {
            if (audioCtx) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) {
                throw new Error('Web Audio API is not supported in this browser.');
            }
            audioCtx = new AudioCtx();

            // Master Chain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5;

            // Persistent Lofi Lowpass Filter (responds in real time to Lofi Filter slider)
            lofiFilter = audioCtx.createBiquadFilter();
            lofiFilter.type = 'lowpass';
            lofiFilter.frequency.value = Number(filterSlider.value);
            lofiFilter.Q.value = 1;

            // Persistent Tape Wobble LFO (responds in real time to Tape Wobble slider)
            wobbleLfo = audioCtx.createOscillator();
            wobbleLfo.type = 'sine';
            wobbleLfo.frequency.value = 0.85;
            wobbleGain = audioCtx.createGain();
            wobbleGain.gain.value = Number(wobbleSlider.value);
            wobbleLfo.connect(wobbleGain);
            wobbleLfo.start();

            // Compressor to glue mix together
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -20;
            compressor.knee.value = 30;
            compressor.ratio.value = 12;
            compressor.attack.value = 0.003;
            compressor.release.value = 0.25;

            // Analyser for visualizer
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            visualizerData = new Uint8Array(analyser.frequencyBinCount);

            // Pre-allocate reusable drum noise buffer & hi-hat waveshaper curve
            const noiseLength = Math.floor(audioCtx.sampleRate * 0.5);
            sharedNoiseBuffer = audioCtx.createBuffer(1, noiseLength, audioCtx.sampleRate);
            const noiseChannel = sharedNoiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseLength; i++) {
                noiseChannel[i] = Math.random() * 2 - 1;
            }
            hihatDistortionCurve = makeDistortionCurve(100);

            // Connect Master Chain
            lofiFilter.connect(masterGain);
            masterGain.connect(compressor);
            compressor.connect(analyser);
            analyser.connect(audioCtx.destination);

            // Mixer Group Nodes
            for (const name of Object.keys(mixerNodes)) {
                mixerNodes[name] = audioCtx.createGain();
                mixerNodes[name].connect(lofiFilter);
                applyChannelGain(name, 0, true);
            }

            // Start Vinyl Crackle Ambience (routed post-filter into masterGain like surface noise)
            createVinylCrackle();
        }

        // --- Instruments ---

        function createKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(mixerNodes.kick);

            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);

            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);

            osc.start(time);
            osc.stop(time + 0.5);
        }

        function createSnare(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = sharedNoiseBuffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1000;
            const noiseGain = audioCtx.createGain();

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(mixerNodes.snare);

            noiseGain.gain.setValueAtTime(0.4, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            noise.start(time);
            noise.stop(time + 0.2);

            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            const oscGain = audioCtx.createGain();
            osc.connect(oscGain);
            oscGain.connect(mixerNodes.snare);

            osc.frequency.setValueAtTime(200, time);
            oscGain.gain.setValueAtTime(0.2, time);
            oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

            osc.start(time);
            osc.stop(time + 0.2);
        }

        function createHiHat(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = sharedNoiseBuffer;

            const bandpass = audioCtx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.value = 10000;

            const highpass = audioCtx.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 5000;

            const distortion = audioCtx.createWaveShaper();
            distortion.curve = hihatDistortionCurve;
            distortion.oversample = '4x';

            const gain = audioCtx.createGain();

            noise.connect(bandpass);
            bandpass.connect(highpass);
            highpass.connect(distortion);
            distortion.connect(gain);
            gain.connect(mixerNodes.hihat);

            const velocity = 0.15 + Math.random() * 0.1;
            gain.gain.setValueAtTime(velocity, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            noise.start(time);
            noise.stop(time + 0.1);
        }

        function stopActiveChord() {
            window.clearTimeout(chordUiTimer);
            if (activeChordGain && audioCtx) {
                const staleGain = activeChordGain;
                activeChordGain = null;
                staleGain.gain.cancelScheduledValues(audioCtx.currentTime);
                staleGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02);
                window.setTimeout(() => {
                    try {
                        staleGain.disconnect();
                    } catch {
                        // Ignore already-disconnected node
                    }
                }, 120);
            }
        }

        function playChord(time, duration) {
            const chordObj = chords[chordProgression[currentChordIndex % chordProgression.length]];
            currentChordIndex++;

            if (!chordObj || !chordObj.offsets) return;

            // Fade out any previous sustaining chord cleanly (e.g. after station BPM switch)
            if (activeChordGain && audioCtx) {
                const prevGain = activeChordGain;
                prevGain.gain.setTargetAtTime(0, time, 0.03);
                window.setTimeout(() => {
                    try {
                        prevGain.disconnect();
                    } catch {
                        // Ignore
                    }
                }, Math.max(150, (time - audioCtx.currentTime + 0.2) * 1000));
            }

            const chordGain = audioCtx.createGain();
            chordGain.gain.setValueAtTime(1, time);
            chordGain.connect(mixerNodes.chord);
            activeChordGain = chordGain;

            window.clearTimeout(chordUiTimer);
            const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
            chordUiTimer = window.setTimeout(() => {
                activeChordName = chordObj.name;
                if (isPlaying) {
                    chordDisplay.textContent = instrumentState.chord ? activeChordName : '--';
                }
            }, delayMs);

            const sustainEnd = Math.max(time + 0.35, time + duration - 0.4);

            for (const midiNote of chordObj.offsets) {
                const osc = audioCtx.createOscillator();
                osc.type = Math.random() > 0.5 ? 'triangle' : 'sine';
                osc.frequency.value = 440 * Math.pow(2, (midiNote - 69) / 12);

                wobbleGain.connect(osc.detune);

                const noteGain = audioCtx.createGain();
                osc.connect(noteGain);
                noteGain.connect(chordGain);

                noteGain.gain.setValueAtTime(0, time);
                noteGain.gain.linearRampToValueAtTime(0.08, time + 0.1);
                noteGain.gain.linearRampToValueAtTime(0.05, time + 0.3);
                noteGain.gain.setValueAtTime(0.05, sustainEnd);
                noteGain.gain.linearRampToValueAtTime(0, time + duration);

                osc.addEventListener('ended', () => {
                    try {
                        wobbleGain.disconnect(osc.detune);
                        noteGain.disconnect();
                    } catch {
                        // Ignore disconnect errors
                    }
                });

                osc.start(time);
                osc.stop(time + duration);
            }
        }

        function createVinylCrackle() {
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            let lastOut = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                const out = (lastOut + 0.02 * white) / 1.02;
                lastOut = out;
                data[i] = out * 3.5;

                if (Math.random() > 0.9995) {
                    data[i] = (Math.random() * 2 - 1) * 0.8;
                }
            }

            vinylNode = audioCtx.createBufferSource();
            vinylNode.buffer = buffer;
            vinylNode.loop = true;

            vinylGain = audioCtx.createGain();
            const crackleVol = Number(crackleSlider.value) / 500;
            vinylGain.gain.value = isPlaying ? crackleVol : 0;

            vinylNode.connect(vinylGain);
            vinylGain.connect(masterGain);
            vinylNode.start();
        }

        // --- Scheduler ---

        function scheduleNote(beatNumber, time) {
            const swing = beatNumber % 2 === 1 ? 0.05 : 0;
            const humanize = (Math.random() - 0.5) * 0.02;
            const triggerTime = Math.max(audioCtx.currentTime, time + swing + humanize);

            const style = stations[currentStation].style;

            if (style === 'classic') {
                if (beatNumber % 8 === 0 && instrumentState.kick) createKick(triggerTime);
                if (beatNumber % 8 === 4 && instrumentState.kick) createKick(triggerTime);
                if ((beatNumber % 8 === 2 || beatNumber % 8 === 6) && instrumentState.snare) createSnare(triggerTime);
                if (instrumentState.hihat) createHiHat(triggerTime);
                if (Math.random() > 0.8 && instrumentState.hihat) createHiHat(triggerTime + (60 / bpm) / 4);
            } else if (style === 'minimal') {
                if (beatNumber % 8 === 0 && instrumentState.kick) createKick(triggerTime);
                if (beatNumber % 8 === 6 && instrumentState.snare) createSnare(triggerTime);
                if (beatNumber % 2 === 0 && instrumentState.hihat) createHiHat(triggerTime);
            } else if (style === 'jazzy') {
                if (beatNumber % 8 === 0 && instrumentState.kick) createKick(triggerTime);
                if (beatNumber % 8 === 3 && Math.random() > 0.5 && instrumentState.kick) createKick(triggerTime);
                if (beatNumber % 8 === 4 && instrumentState.kick) createKick(triggerTime);
                if ((beatNumber % 8 === 2 || beatNumber % 8 === 6) && instrumentState.snare) createSnare(triggerTime);
                if (instrumentState.hihat) createHiHat(triggerTime);
                if (beatNumber % 4 === 0 && instrumentState.hihat) createHiHat(triggerTime + (60 / bpm) / 4);
            }

            // 16 eighth-note steps === 8 quarter beats (2 bars of 4/4)
            if (beatNumber % 16 === 0) {
                if (currentChordIndex > 0 && currentChordIndex % chordProgression.length === 0 && Math.random() > 0.7) {
                    shuffleInPlace(chordProgression);
                }
                playChord(triggerTime, (60 / bpm) * 8);
            }

            if (style !== 'minimal' && beatNumber % 8 === 3 && Math.random() > 0.7 && instrumentState.kick) {
                createKick(triggerTime + 0.2);
            }
        }

        function nextNote() {
            const secondsPerBeat = 60.0 / bpm;
            nextNoteTime += 0.5 * secondsPerBeat; // 8th-note steps
            beatCount++;
        }

        function scheduler() {
            if (!isPlaying || !audioCtx) return;

            // Clamp if playback fell behind (e.g. after device sleep) to prevent catch-up burst
            if (audioCtx.currentTime - nextNoteTime > 0.25) {
                nextNoteTime = audioCtx.currentTime + 0.05;
            }

            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                if (beatCount % 2 === 0) {
                    lastQuarterBeatTime = nextNoteTime;
                }
                scheduleNote(beatCount, nextNoteTime);
                nextNote();
            }

            timerID = window.setTimeout(scheduler, lookahead);
        }

        // --- Rhythm Scoring ---

        function showHitFeedback(text, color) {
            const feedback = document.createElement('div');
            feedback.className = 'hit-feedback';
            feedback.textContent = text;
            feedback.style.color = color;
            feedback.style.left = '50%';
            feedback.style.top = '40%';

            visualizerScreen.appendChild(feedback);
            window.setTimeout(() => {
                feedback.remove();
            }, 800);
        }

        function updateScore(points) {
            if (points > 0) {
                score += points;
                streak += 1;

                scoreEl.textContent = String(score).padStart(4, '0');
                scoreEl.classList.remove('score-pop');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('score-pop');

                if (score > bestScore) {
                    bestScore = score;
                    saveBestScore(bestScore);
                    bestEl.textContent = String(bestScore).padStart(4, '0');
                }
            } else {
                streak = 0;
            }
            streakEl.textContent = `x${streak}`;
        }

        // --- Visualizer ---

        function drawVisualizer() {
            if (!isPlaying || !analyser || !visualizerData) {
                visualizerRafId = 0;
                return;
            }

            visualizerRafId = window.requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(visualizerData);

            const width = canvasCssWidth || canvas.clientWidth;
            const height = canvasCssHeight || canvas.clientHeight;
            canvasCtx.clearRect(0, 0, width, height);

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = 'rgba(217, 119, 6, 0.8)';
            canvasCtx.beginPath();

            const bufferLength = visualizerData.length;
            const sliceWidth = width / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = visualizerData[i] / 128.0;
                const y = height - (v * height) / 1.5;

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);

                x += sliceWidth;
            }

            canvasCtx.stroke();
        }

        function startVisualizer() {
            if (!visualizerRafId) {
                visualizerRafId = window.requestAnimationFrame(drawVisualizer);
            }
        }

        function stopVisualizer() {
            if (visualizerRafId) {
                window.cancelAnimationFrame(visualizerRafId);
                visualizerRafId = 0;
            }
            const width = canvasCssWidth || canvas.clientWidth;
            const height = canvasCssHeight || canvas.clientHeight;
            canvasCtx.clearRect(0, 0, width, height);
        }

        // --- Transport & UI Interactions ---

        function getIdleStatusText() {
            return hasStartedOnce ? 'PAUSED' : 'READY...';
        }

        playBtn.addEventListener('click', async () => {
            if (isTogglingPlay) return;
            isTogglingPlay = true;

            try {
                if (!isPlaying) {
                    window.clearTimeout(pauseSuspendTimer);
                    await initAudio();
                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }

                    window.clearTimeout(timerID);
                    stopActiveChord();

                    isPlaying = true;
                    hasStartedOnce = true;
                    nextNoteTime = audioCtx.currentTime + 0.1;
                    beatCount = 0;
                    lastQuarterBeatTime = nextNoteTime;
                    lastScoredBeatTime = -Infinity;

                    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGain.gain.setTargetAtTime(0.5, audioCtx.currentTime, 0.08);

                    if (vinylGain) {
                        vinylGain.gain.cancelScheduledValues(audioCtx.currentTime);
                        vinylGain.gain.setTargetAtTime(Number(crackleSlider.value) / 500, audioCtx.currentTime, 0.08);
                    }

                    scheduler();
                    startVisualizer();

                    playBtn.classList.add('playing');
                    playBtn.setAttribute('aria-label', 'Pause');
                    playBtn.setAttribute('aria-pressed', 'true');
                    statusText.textContent = 'PLAYING...';
                    statusText.classList.remove('animate-pulse');
                    tapeWheels.classList.remove('opacity-0');
                } else {
                    isPlaying = false;
                    window.clearTimeout(timerID);
                    stopActiveChord();
                    stopVisualizer();

                    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04);

                    if (vinylGain) {
                        vinylGain.gain.cancelScheduledValues(audioCtx.currentTime);
                        vinylGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                    }

                    window.clearTimeout(pauseSuspendTimer);
                    pauseSuspendTimer = window.setTimeout(() => {
                        if (!isPlaying && audioCtx && audioCtx.state === 'running') {
                            audioCtx.suspend().catch(() => {});
                        }
                    }, 180);

                    playBtn.classList.remove('playing');
                    playBtn.setAttribute('aria-label', 'Play');
                    playBtn.setAttribute('aria-pressed', 'false');
                    statusText.textContent = 'PAUSED';
                    statusText.classList.add('animate-pulse');
                    tapeWheels.classList.add('opacity-0');
                    chordDisplay.textContent = '--';
                }
            } catch (err) {
                console.error('Playback error:', err);
                statusText.textContent = 'AUDIO ERROR';
            } finally {
                isTogglingPlay = false;
            }
        });

        // Effect Sliders (live AudioParam modulation)
        filterSlider.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            filterValEl.textContent = `${val}Hz`;
            if (lofiFilter && audioCtx) {
                lofiFilter.frequency.setTargetAtTime(val, audioCtx.currentTime, 0.03);
            }
        });

        crackleSlider.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            crackleValEl.textContent = `${val}%`;
            if (vinylGain && audioCtx && isPlaying) {
                vinylGain.gain.setTargetAtTime(val / 500, audioCtx.currentTime, 0.08);
            }
        });

        wobbleSlider.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            wobbleValEl.textContent = formatWobbleLabel(val);
            if (wobbleGain && audioCtx) {
                wobbleGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.04);
            }
        });

        // Station Switching
        function switchStation(id) {
            if (!Object.hasOwn(stations, id)) return;
            currentStation = id;
            const data = stations[id];
            bpm = data.bpm;
            chordProgression = [...data.progression];
            currentChordIndex = 0;

            document.querySelectorAll('[data-station]').forEach((btn) => {
                const active = btn.dataset.station === id;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', String(active));
            });

            statusText.textContent = data.name.toUpperCase();
            statusText.classList.remove('animate-pulse');

            chordDisplay.className = `text-sm h-5 font-mono transition-colors duration-500 ${data.color}`;

            window.clearTimeout(stationBannerTimer);
            stationBannerTimer = window.setTimeout(() => {
                statusText.textContent = isPlaying ? 'PLAYING...' : getIdleStatusText();
                if (!isPlaying) statusText.classList.add('animate-pulse');
            }, 2000);
        }

        document.querySelectorAll('[data-station]').forEach((btn) => {
            btn.addEventListener('click', () => switchStation(btn.dataset.station));
        });

        // Mixer Volume & Instrument Toggles
        function updateMixerVolume(name, value) {
            if (!Object.hasOwn(instrumentVolumes, name)) return;
            instrumentVolumes[name] = Number(value) / 100;
            if (instrumentState[name]) {
                applyChannelGain(name, 0.05);
            }
        }

        function toggleInstrument(name) {
            if (!Object.hasOwn(instrumentState, name)) return;

            // Rhythm Scoring (once per quarter beat to prevent spam farming)
            if (isPlaying && audioCtx && lastQuarterBeatTime >= 0) {
                const now = audioCtx.currentTime;
                const secondsPerBeat = 60 / bpm;
                const adjacentBeat = now >= lastQuarterBeatTime
                    ? lastQuarterBeatTime + secondsPerBeat
                    : lastQuarterBeatTime - secondsPerBeat;
                const targetBeatTime = Math.abs(now - lastQuarterBeatTime) <= Math.abs(now - adjacentBeat)
                    ? lastQuarterBeatTime
                    : adjacentBeat;

                if (Math.abs(targetBeatTime - lastScoredBeatTime) >= secondsPerBeat * 0.5) {
                    lastScoredBeatTime = targetBeatTime;
                    const minDiff = Math.abs(now - targetBeatTime);

                    let points = 0;
                    let label = 'MISS';
                    let color = '#ef4444';
                    if (minDiff < 0.08) {
                        points = 100;
                        label = 'PERFECT';
                        color = '#fbbf24';
                    } else if (minDiff < 0.15) {
                        points = 50;
                        label = 'GREAT';
                        color = '#fb923c';
                    } else if (minDiff < 0.25) {
                        points = 25;
                        label = 'GOOD';
                        color = '#fcd34d';
                    }

                    showHitFeedback(label, color);
                    updateScore(points);
                }
            }

            instrumentState[name] = !instrumentState[name];
            const btn = document.getElementById(`mix-${name}`);
            if (btn) {
                btn.classList.toggle('active', instrumentState[name]);
                btn.setAttribute('aria-pressed', String(instrumentState[name]));
            }

            applyChannelGain(name, 0.02);

            if (name === 'chord') {
                chordDisplay.textContent = instrumentState.chord && isPlaying ? activeChordName : '--';
            }
        }

        document.querySelectorAll('[data-mixer-volume]').forEach((input) => {
            input.addEventListener('input', () => {
                updateMixerVolume(input.dataset.mixerVolume, input.value);
            });
        });

        document.querySelectorAll('[data-instrument]').forEach((btn) => {
            btn.addEventListener('click', () => {
                toggleInstrument(btn.dataset.instrument);
            });
        });

        // Help Modal System
        const helpData = {
            filter: {
                title: 'Lofi Filter',
                desc: 'Cuts out high frequencies across the mix to create a warm, muffled tone reminiscent of vintage radios and cassette decks.',
                impl: 'Routes all instrument channels through a shared lowpass BiquadFilterNode modulated smoothly from 100Hz to 3000Hz in real time.',
            },
            crackle: {
                title: 'Vinyl Crackle',
                desc: 'Adds a warm bed of surface noise with occasional pops and clicks characteristic of aged vinyl records.',
                impl: 'Loops a 2-second AudioBuffer of filtered Brown/Pink noise with stochastic impulse spikes mixed post-filter.',
            },
            wobble: {
                title: 'Tape Wobble',
                desc: 'Creates subtle analog pitch fluctuations (Wow & Flutter) found in imperfect cassette tape transports.',
                impl: 'Connects a shared Low-Frequency Oscillator (LFO) to the detune AudioParam of every chord oscillator with live depth control.',
            },
            chord: {
                title: 'Chord Synthesis',
                desc: 'Displays the current jazz harmony voicing shaping each station’s progression.',
                impl: 'Synthesizes station-specific 9th, 11th, and 13th MIDI voicings with Sine/Triangle oscillator mixing and ADSR envelopes.',
            },
        };

        function showHelp(key, triggerEl = null) {
            if (!Object.hasOwn(helpData, key)) return;
            const data = helpData[key];
            lastHelpTrigger = triggerEl;
            helpTitle.textContent = data.title;

            helpContent.replaceChildren();
            for (const [heading, body] of [
                ['Effect', data.desc],
                ['Implementation', data.impl],
            ]) {
                const section = document.createElement('div');
                if (heading === 'Implementation') section.className = 'pt-2';
                const h4 = document.createElement('h4');
                h4.className = 'text-amber-600/70 uppercase text-[10px] font-black mb-1 leading-tight';
                h4.textContent = heading;
                const p = document.createElement('p');
                p.textContent = body;
                section.append(h4, p);
                helpContent.appendChild(section);
            }

            helpModal.classList.remove('hidden');
            helpModal.setAttribute('aria-hidden', 'false');
            const closeBtn = helpModal.querySelector('[data-close-help]');
            if (closeBtn) closeBtn.focus();
        }

        function hideHelp() {
            if (helpModal.classList.contains('hidden')) return;
            helpModal.classList.add('hidden');
            helpModal.setAttribute('aria-hidden', 'true');
            if (lastHelpTrigger && typeof lastHelpTrigger.focus === 'function') {
                lastHelpTrigger.focus();
                lastHelpTrigger = null;
            }
        }

        document.querySelectorAll('[data-help]').forEach((btn) => {
            btn.addEventListener('click', () => showHelp(btn.dataset.help, btn));
        });

        document.querySelectorAll('[data-close-help]').forEach((btn) => {
            btn.addEventListener('click', hideHelp);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideHelp();
        });

        helpModal.addEventListener('click', (e) => {
            if (e.target === helpModal) hideHelp();
        });
    </script>
</body>

</html>
