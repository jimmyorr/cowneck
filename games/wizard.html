    <div id="root"></div>

    <script type="text/babel" data-plugins="transform-react-jsx">
        const { useState, useEffect, useRef } = React;

        // --- Components ---

        const Card = ({ card, onClick, disabled, size = 'md', className = '' }) => {
            if (!card) return null;
            const isRed = card.suit === 'Hearts' || card.suit === 'Diamonds';
            const display = getCardDisplay(card);
            const icon = getCardIcon(card);

            return (
                <div
                    onClick={!disabled ? onClick : undefined}
                    className={`card-proportion bg-white rounded-lg border-2 border-slate-300 flex flex-col justify-between p-1 md:p-2 cursor-pointer transition-all card-shadow select-none
                        ${size === 'sm' ? '!w-16 md:!w-20' : ''}
                        ${disabled ? 'opacity-50 grayscale cursor-not-allowed' : 'hover:-translate-y-2 hover:border-blue-500'}
                        ${className}`}
                >
                    <div className={`text-xs md:text-sm font-bold flex flex-col leading-none ${isRed ? 'text-red-500' : 'text-slate-800'}`}>
                        <span>{display}</span>
                        <span>{icon}</span>
                    </div>
                    <div className="flex justify-center items-center flex-1 text-2xl md:text-4xl">
                        {icon}
                    </div>
                    <div className={`text-xs md:text-sm font-bold flex flex-col leading-none transform rotate-180 self-end ${isRed ? 'text-red-500' : 'text-slate-800'}`}>
                        <span>{display}</span>
                        <span>{icon}</span>
                    </div>
                </div>
            );
        };

        const HUD = ({ players, round, maxRounds, trumpCard, trumpSuit, playerBid, playerTricks }) => {
            const isRedTrump = trumpSuit === 'Hearts' || trumpSuit === 'Diamonds';
            return (
                <div className="grid grid-cols-3 gap-4 mb-4">
                    <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                        <h3 className="text-xs text-slate-400 font-bold mb-1">Round</h3>
                        <p className="text-xl font-bold">{round} <span className="text-xs text-slate-500 font-normal">/ {maxRounds}</span></p>
                    </div>
                    <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700 flex flex-col items-center justify-center">
                        <h3 className="text-xs text-slate-400 font-bold mb-1">Trump</h3>
                        {trumpSuit !== 'None' ? (
                            <div className="flex items-center gap-1.5">
                                {trumpCard?.type === 'wizard' && <span className="text-lg" title="Chosen by Wizard">🧙</span>}
                                <span className={`text-2xl leading-none ${isRedTrump ? 'text-red-500' : 'text-white'}`}>
                                    {SUIT_ICONS[trumpSuit]}
                                </span>
                                <span className="text-xs font-semibold">{trumpSuit}</span>
                            </div>
                        ) : (
                            <span className="text-lg font-bold italic text-slate-400">
                                {trumpCard?.type === 'jester' ? '🤡 None' : 'None'}
                            </span>
                        )}
                    </div>
                    <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                        <h3 className="text-xs text-slate-400 font-bold mb-1">{players[0]?.name || 'You'}'s bid</h3>
                        <p className="text-xl font-bold">{playerTricks} / {playerBid}</p>
                    </div>
                </div>
            );
        };

        const ScoreBoard = ({ players, currentTurn }) => (
            <div className="bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl overflow-hidden shadow-2xl">
                <div className="p-3 bg-slate-700/50 border-b border-slate-600">
                    <h2 className="text-sm font-bold">Standings</h2>
                </div>
                <div className="divide-y divide-slate-700">
                    {players.map((p, i) => (
                        <div key={p.id} className={`p-3 flex justify-between items-center ${currentTurn === i ? 'bg-blue-900/30' : ''}`}>
                            <div className="flex flex-col">
                                <span className={`text-sm font-medium ${currentTurn === i ? 'text-blue-400' : 'text-slate-200'}`}>
                                    {p.name} {p.isHuman ? '(You)' : ''}
                                </span>
                                <span className="text-xs text-slate-500">Bid: {p.bid} | Won: {p.tricks}</span>
                            </div>
                            <span className="text-lg font-bold">{p.score}</span>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- Rules Modal Component ---
        const RulesModal = ({ isOpen, onClose }) => {
            const [activeTab, setActiveTab] = useState('overview'); // overview, cards, trump

            useEffect(() => {
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        onClose();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isOpen, onClose]);

            if (!isOpen) return null;

            return (
                <div 
                    onClick={onClose} 
                    className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in"
                >
                    <div 
                        onClick={(e) => e.stopPropagation()} 
                        className="bg-slate-900 border border-slate-700/80 rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden"
                    >
                        {/* Header */}
                        <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/40">
                            <h2 className="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent flex items-center gap-2">
                                🧙 Wizard guide & rules
                            </h2>
                            <button 
                                onClick={onClose} 
                                className="p-1.5 hover:bg-slate-800 rounded-full text-slate-400 hover:text-white transition-colors" 
                                aria-label="Close rules"
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>

                        {/* Tabs */}
                        <div className="flex border-b border-slate-800 bg-slate-900/60 p-2 gap-1">
                            <button
                                onClick={() => setActiveTab('overview')}
                                className={`flex-1 py-2 px-3 rounded-xl text-xs md:text-sm font-bold transition-all ${activeTab === 'overview' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}
                            >
                                📋 Overview & play
                            </button>
                            <button
                                onClick={() => setActiveTab('cards')}
                                className={`flex-1 py-2 px-3 rounded-xl text-xs md:text-sm font-bold transition-all ${activeTab === 'cards' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}
                            >
                                🧙 Special cards
                            </button>
                            <button
                                onClick={() => setActiveTab('trump')}
                                className={`flex-1 py-2 px-3 rounded-xl text-xs md:text-sm font-bold transition-all ${activeTab === 'trump' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}
                            >
                                🎺 Trump & scoring
                            </button>
                        </div>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-6 text-slate-300">
                            {activeTab === 'overview' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div>
                                        <h3 className="text-lg font-bold text-white mb-1">Objective</h3>
                                        <p className="text-sm leading-relaxed text-slate-400">
                                            Wizard is a game of prediction. Your goal is to bid <strong className="text-white">exactly</strong> how many tricks you think you will win in each round. If you guess correctly, you score points; otherwise, you lose points.
                                        </p>
                                    </div>
                                    <div className="border-t border-slate-800/80 pt-4">
                                        <h3 className="text-lg font-bold text-white mb-2">Round progression</h3>
                                        <p className="text-sm leading-relaxed text-slate-400 mb-2">
                                            Using a 60-card deck, the number of rounds depends on player count (20 rounds for 3p, 15 for 4p, 12 for 5p, 10 for 6p). Each round deals cards equal to the round number:
                                        </p>
                                        <div className="bg-slate-950/40 border border-slate-800 p-3 rounded-2xl flex justify-around text-center text-xs">
                                            <div>
                                                <span className="block text-slate-500 font-semibold">Round 1</span>
                                                <span className="text-lg font-black text-blue-400">1 card</span>
                                            </div>
                                            <div className="flex items-center text-slate-600 font-bold">➔</div>
                                            <div>
                                                <span className="block text-slate-500 font-semibold">Mid-game</span>
                                                <span className="text-lg font-black text-indigo-400">+1 / round</span>
                                            </div>
                                            <div className="flex items-center text-slate-600 font-bold">➔</div>
                                            <div>
                                                <span className="block text-slate-500 font-semibold">Final round</span>
                                                <span className="text-lg font-black text-purple-400">Full 60 dealt</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="border-t border-slate-800/80 pt-4">
                                        <h3 className="text-lg font-bold text-white mb-2">Trick play</h3>
                                        <ul className="text-sm space-y-2 list-disc pl-5 text-slate-400 leading-relaxed">
                                            <li>The leading player plays any card. Normal cards rank from <strong className="text-white">Ace (high)</strong> down to <strong className="text-white">2 (low)</strong>.</li>
                                            <li>Other players must <strong className="text-white">follow suit</strong> (play the same suit as the led card) if they have one in their hand.</li>
                                            <li>If they do not have a card of the led suit, they can play any other card (including trump).</li>
                                            <li><strong className="text-white">Exceptions:</strong> Wizards and Jesters can be played at any time, even if you have cards of the led suit!</li>
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'cards' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="bg-slate-950/30 border border-slate-800 p-4 rounded-2xl flex gap-4 items-start">
                                        <div className="w-16 h-24 bg-gradient-to-br from-indigo-600 to-blue-700 rounded-xl border border-indigo-400 flex flex-col justify-between p-2 shadow-lg flex-shrink-0 select-none">
                                            <span className="text-sm font-bold leading-none text-indigo-200">W</span>
                                            <span className="text-3xl self-center leading-none">🧙</span>
                                            <span className="text-sm font-bold leading-none rotate-180 text-indigo-200">W</span>
                                        </div>
                                        <div className="space-y-1">
                                            <h4 className="text-base font-extrabold text-white flex items-center gap-1.5">
                                                🧙 The Wizard <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">4 in deck</span>
                                            </h4>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                The ultimate trick-winner. A Wizard beats all other cards, including high trump cards.
                                            </p>
                                            <ul className="text-xs list-disc pl-4 text-slate-400 space-y-1 pt-1">
                                                <li>Can be played at any time, regardless of lead suit.</li>
                                                <li>The <strong className="text-white">first Wizard</strong> played in a trick always wins that trick.</li>
                                                <li>If a Wizard is led, players can play whatever card they want (no suit follow-rule applies).</li>
                                            </ul>
                                        </div>
                                    </div>

                                    <div className="bg-slate-950/30 border border-slate-800 p-4 rounded-2xl flex gap-4 items-start">
                                        <div className="w-16 h-24 bg-gradient-to-br from-slate-700 to-slate-800 rounded-xl border border-slate-600 flex flex-col justify-between p-2 shadow-lg flex-shrink-0 select-none">
                                            <span className="text-sm font-bold leading-none text-slate-400">J</span>
                                            <span className="text-3xl self-center leading-none">🤡</span>
                                            <span className="text-sm font-bold leading-none rotate-180 text-slate-400">J</span>
                                        </div>
                                        <div className="space-y-1">
                                            <h4 className="text-base font-extrabold text-white flex items-center gap-1.5">
                                                🤡 The Jester <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-500/20 text-slate-400 border border-slate-500/30">4 in deck</span>
                                            </h4>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                The ultimate throw-away card. A Jester is essentially worth zero and cannot win, making it perfect for avoiding unwanted tricks.
                                            </p>
                                            <ul className="text-xs list-disc pl-4 text-slate-400 space-y-1 pt-1">
                                                <li>Can be played at any time, regardless of lead suit.</li>
                                                <li>A Jester <strong className="text-white">never wins</strong> a trick, unless the trick consists <em>entirely</em> of Jesters (in which case the first Jester wins).</li>
                                                <li>If a Jester is led, the first non-Jester played after it determines the lead suit.</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'trump' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div>
                                        <h3 className="text-lg font-bold text-white mb-2">🎺 The trump suit</h3>
                                        <p className="text-sm leading-relaxed text-slate-400 mb-3">
                                            Trump cards are powerful game-changers. Any card of the trump suit beats any card of the normal lead suit, regardless of their face values.
                                        </p>
                                        <div className="bg-slate-950/30 border border-slate-800 p-4 rounded-2xl space-y-3 text-xs">
                                            <h4 className="font-extrabold text-white">How trump is decided each round:</h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                <div className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                                    <span className="font-bold text-red-400">♦/♥/♣/♠ Normal card flipped:</span>
                                                    <p className="text-slate-400 mt-1">The flipped card's suit is the trump suit for the entire round.</p>
                                                </div>
                                                <div className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                                    <span className="font-bold text-blue-400">🧙 Wizard flipped:</span>
                                                    <p className="text-slate-400 mt-1">A random suit is chosen as the trump suit.</p>
                                                </div>
                                                <div className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                                    <span className="font-bold text-slate-400">🤡 Jester flipped:</span>
                                                    <p className="text-slate-400 mt-1">There is no trump suit for this round (no trump).</p>
                                                </div>
                                                <div className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                                    <span className="font-bold text-purple-400">Final round (no upcard):</span>
                                                    <p className="text-slate-400 mt-1">Since all 60 cards are dealt, no card is flipped and there is no trump.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="border-t border-slate-800/80 pt-4">
                                        <h3 className="text-lg font-bold text-white mb-2">💯 Scoring system</h3>
                                        <p className="text-sm leading-relaxed text-slate-400 mb-3">
                                            Scoring is based strictly on your ability to accurately estimate your trick count.
                                        </p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <div className="bg-emerald-950/20 border border-emerald-500/30 p-3.5 rounded-2xl">
                                                <h4 className="text-emerald-400 font-extrabold text-sm mb-1">Correct bid (made it!)</h4>
                                                <p className="text-xs text-slate-300">
                                                    You receive <strong className="text-emerald-300">20 points</strong> base, plus <strong className="text-emerald-300">10 points</strong> for each trick you won.
                                                </p>
                                                <span className="inline-block mt-2 text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">Example: Bid 2, Won 2 = +40 pts</span>
                                            </div>
                                            <div className="bg-rose-950/20 border border-rose-500/30 p-3.5 rounded-2xl">
                                                <h4 className="text-rose-400 font-extrabold text-sm mb-1">Incorrect bid (over/under)</h4>
                                                <p className="text-xs text-slate-300">
                                                    You lose <strong className="text-rose-300">10 points</strong> for each trick you were off (whether you won too many or too few).
                                                </p>
                                                <span className="inline-block mt-2 text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded font-mono">Example: Bid 2, Won 4 = -20 pts</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="p-4 border-t border-slate-800 bg-slate-900/60 flex justify-end">
                            <button
                                onClick={onClose}
                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-blue-500/20 transition-all active:scale-95 text-sm"
                            >
                                Let's play!
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---

        function App() {
            const [gameState, setGameState] = useState('start'); // start, bidding, playing, roundEnd, gameEnd, simulationResults
            const [players, setPlayers] = useState([]);
            const [round, setRound] = useState(1);
            const [maxRounds, setMaxRounds] = useState(15);
            const [trumpCard, setTrumpCard] = useState(null);
            const [trumpSuit, setTrumpSuit] = useState('None');
            const [currentTrick, setCurrentTrick] = useState([]);
            const [turn, setTurn] = useState(0);
            const [leadSuit, setLeadSuit] = useState('None');
            const [logs, setLogs] = useState([]);
            const [simulationStats, setSimulationStats] = useState(null);
            const [fastForward, setFastForward] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [spectatorMode, setSpectatorMode] = useState(false);
            const [playerName, setPlayerName] = useState('You');
            const [selectedOpponents, setSelectedOpponents] = useState(BOT_NAMES.slice(0, 3));
            const [hoveredOpponent, setHoveredOpponent] = useState(null);
            const [showRules, setShowRules] = useState(false);
            const [simCount, setSimCount] = useState(100);
            const [lastSimulatedCount, setLastSimulatedCount] = useState(100);
            const [showAdvanced, setShowAdvanced] = useState(false);

            const timerRef = useRef(null);

            useEffect(() => {
                try {
                    const savedName = localStorage.getItem('wizard_playerName');
                    if (savedName !== null) setPlayerName(savedName);
                } catch { /* ignore */ }
            }, []);

            useEffect(() => {
                try {
                    if (playerName) localStorage.setItem('wizard_playerName', playerName);
                    else localStorage.removeItem('wizard_playerName');
                } catch { /* ignore */ }
            }, [playerName]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const inMatch = gameState === 'bidding' || gameState === 'playing' || gameState === 'roundEnd';
                    if (e.key === 'Escape' && inMatch && !showRules) {
                        setIsPaused(p => !p);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState, showRules]);

            useEffect(() => () => clearTimeout(timerRef.current), []);

            const addLog = (msg) => setLogs(prev => [msg, ...prev].slice(0, 50));

            const startSimulationWithCount = () => {
                const boundedCount = Math.min(2000, Math.max(1, simCount));
                const stats = {};
                selectedOpponents.forEach(n => { stats[n] = 0; });

                for (let i = 0; i < boundedCount; i++) {
                    const simPlayers = selectedOpponents.map((name, id) => ({ id, name, isHuman: false, score: 0, bid: 0, tricks: 0, hand: [] }));
                    runFullGameSync(simPlayers);
                    simPlayers.sort((a, b) => b.score - a.score);
                    stats[simPlayers[0].name]++;
                }
                setLastSimulatedCount(boundedCount);
                setSimulationStats(stats);
                setGameState('simulationResults');
            };

            const initGame = (spectator = false) => {
                clearTimeout(timerRef.current);
                setIsPaused(false);
                const initialPlayers = [];
                if (!spectator) {
                    initialPlayers.push({ id: 0, name: playerName.trim() || 'You', isHuman: true, score: 0, bid: 0, tricks: 0, hand: [] });
                } else {
                    const seatZeroBot = BOT_NAMES.find(n => !selectedOpponents.includes(n)) || 'Dealer';
                    initialPlayers.push({ id: 0, name: seatZeroBot, isHuman: false, score: 0, bid: 0, tricks: 0, hand: [] });
                }

                selectedOpponents.forEach((name, i) => {
                    initialPlayers.push({ id: i + 1, name, isHuman: false, score: 0, bid: 0, tricks: 0, hand: [] });
                });

                const totalRounds = getMaxRounds(initialPlayers.length);
                setMaxRounds(totalRounds);
                setPlayers(initialPlayers);
                setRound(1);
                setLogs([`A ${totalRounds}-round game of Wizard has begun!`]);
                setSpectatorMode(spectator);
                startRound(1, initialPlayers);
            };

            const startRound = (r, currentPlayers = players) => {
                const fullDeck = createDeck();
                const dealtPlayers = currentPlayers.map(p => ({ ...p, hand: [], bid: 0, tricks: 0 }));

                for (let i = 0; i < r; i++) {
                    dealtPlayers.forEach(p => {
                        const card = fullDeck.pop();
                        if (card) p.hand.push(card);
                    });
                }

                const upcard = fullDeck.length > 0 ? fullDeck.pop() : null;
                let tSuit = 'None';
                if (upcard) {
                    if (upcard.type === 'wizard') {
                        tSuit = SUITS[Math.floor(Math.random() * SUITS.length)];
                        addLog(`Wizard flipped! Trump is ${tSuit}.`);
                    } else if (upcard.type === 'jester') {
                        addLog('Jester flipped! No trump.');
                    } else {
                        tSuit = upcard.suit;
                    }
                } else {
                    addLog('Final round! All 60 cards dealt — no trump.');
                }

                setTrumpCard(upcard);
                setTrumpSuit(tSuit);
                setPlayers(dealtPlayers);
                setTurn(r % dealtPlayers.length);
                setLeadSuit('None');
                setCurrentTrick([]);
                setGameState('bidding');
            };

            const handleBid = (bidVal) => {
                const newPlayers = players.map((p, i) => {
                    if (i === 0) return { ...p, bid: bidVal };
                    return { ...p, bid: calculateBotBid(p, round, trumpSuit) };
                });

                setPlayers(newPlayers);
                setGameState('playing');
                addLog(`Bids are locked in. Round ${round} begins!`);
            };

            const executePlay = (pIdx, cardIdx) => {
                if (currentTrick.length >= players.length) return;
                const p = players[pIdx];
                if (!p) return;
                const card = p.hand[cardIdx];
                if (!card || !isValidPlay(card, p.hand, leadSuit)) return;

                const newHand = [...p.hand];
                newHand.splice(cardIdx, 1);

                const newPlayers = [...players];
                newPlayers[pIdx] = { ...p, hand: newHand };

                const newTrick = [...currentTrick, { pIdx, card }];
                let newLead = leadSuit;
                if (leadSuit === 'None' && card.type !== 'jester') {
                    newLead = card.type === 'wizard' ? 'Wizard' : card.suit;
                }

                setPlayers(newPlayers);
                setCurrentTrick(newTrick);
                setLeadSuit(newLead);
                setTurn((pIdx + 1) % players.length);
            };

            useEffect(() => {
                if (isPaused) return;
                if (gameState === 'playing' && players.length > 0 && currentTrick.length === players.length) {
                    timerRef.current = setTimeout(() => resolveTrick(), fastForward ? 100 : 1000);
                } else if (gameState === 'playing' && players[turn] && !players[turn].isHuman && currentTrick.length < players.length) {
                    timerRef.current = setTimeout(() => aiMove(), fastForward ? 50 : 800);
                } else if (gameState === 'bidding' && spectatorMode && players[0]) {
                    timerRef.current = setTimeout(() => handleBid(calculateBotBid(players[0], round, trumpSuit)), fastForward ? 100 : 500);
                }
                return () => clearTimeout(timerRef.current);
            }, [turn, currentTrick, gameState, spectatorMode, isPaused, fastForward]);

            const aiMove = () => {
                const p = players[turn];
                if (!p || p.hand.length === 0) return;
                const cardIdx = chooseAICardIndex(p, leadSuit, trumpSuit);
                executePlay(turn, cardIdx);
            };

            const resolveTrick = () => {
                if (currentTrick.length === 0) return;
                const winnerIdx = determineTrickWinner(currentTrick, trumpSuit);

                const newPlayers = players.map((p, idx) => (
                    idx === winnerIdx ? { ...p, tricks: p.tricks + 1 } : p
                ));
                setPlayers(newPlayers);
                addLog(`${newPlayers[winnerIdx].name} took the trick.`);

                setCurrentTrick([]);
                setLeadSuit('None');
                setTurn(winnerIdx);

                if (newPlayers[0].hand.length === 0) {
                    resolveRound(newPlayers);
                }
            };

            const resolveRound = (finalPlayers) => {
                const scoredPlayers = finalPlayers.map(p => {
                    const diff = Math.abs(p.tricks - p.bid);
                    const gain = diff === 0 ? (20 + p.tricks * 10) : -(diff * 10);
                    return { ...p, score: p.score + gain };
                });
                setPlayers(scoredPlayers);
                setGameState('roundEnd');
            };

            const nextRound = () => {
                if (round >= maxRounds) {
                    setGameState('gameEnd');
                    if (window.confetti) window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                } else {
                    const nextR = round + 1;
                    setRound(nextR);
                    startRound(nextR);
                }
            };

            const returnToMenu = () => {
                clearTimeout(timerRef.current);
                setIsPaused(false);
                setCurrentTrick([]);
                setGameState('start');
            };

            const trickComplete = players.length > 0 && currentTrick.length >= players.length;

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-6xl mx-auto">
                    {gameState === 'start' && (
                        <div className="flex-1 flex flex-col items-center justify-center py-8">
                            <div className="bg-slate-800/50 p-6 md:p-8 rounded-3xl border border-slate-700 max-w-xl w-full text-center shadow-2xl">
                                <h1 className="text-4xl font-extrabold mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Wizard</h1>
                                <p className="text-slate-400 mb-6 text-sm">Predict exactly how many tricks you will win.</p>

                                {/* Path 1: Join / Play */}
                                <div className="space-y-6 text-left mb-8">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Your name</label>
                                        <input
                                            type="text"
                                            autoFocus
                                            value={playerName}
                                            onChange={(e) => setPlayerName(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3 text-white focus:outline-none focus:border-blue-500 transition-colors"
                                            placeholder="Enter your name..."
                                            maxLength={12}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 ml-1">Choose opponents ({selectedOpponents.length} selected):</label>
                                        <div className="flex flex-wrap gap-2 mb-2">
                                            {ALL_BOTS.map(bot => {
                                                const isSelected = selectedOpponents.includes(bot.name);
                                                return (
                                                    <button
                                                        key={bot.name}
                                                        onMouseEnter={() => setHoveredOpponent(bot)}
                                                        onMouseLeave={() => setHoveredOpponent(null)}
                                                        onClick={() => {
                                                            if (isSelected) {
                                                                if (selectedOpponents.length > 2) {
                                                                    setSelectedOpponents(selectedOpponents.filter(n => n !== bot.name));
                                                                }
                                                            } else {
                                                                if (selectedOpponents.length < 5) {
                                                                    setSelectedOpponents([...selectedOpponents, bot.name]);
                                                                }
                                                            }
                                                        }}
                                                        className={`px-4 py-2 rounded-full text-xs font-bold border transition-all ${isSelected ? 'bg-yellow-500 border-yellow-400 text-slate-900 shadow-lg shadow-yellow-500/20' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                                    >
                                                        {bot.name}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        <div className="h-4 text-center">
                                            {hoveredOpponent && <span className="text-[10px] text-blue-400 italic">{hoveredOpponent.desc}</span>}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => initGame(false)} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/20 transition-all active:scale-95">
                                            Play
                                        </button>
                                        <button onClick={() => setShowRules(true)} className="w-full bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-300 py-3 rounded-2xl font-bold text-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                                            Rules guide 📖
                                        </button>
                                    </div>
                                </div>

                                <div className="border-t border-slate-700 my-8 pt-8">
                                    {/* Path 2: Spectate */}
                                    <div className="text-left mb-8">
                                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 ml-1">Watch a game</h3>
                                        <button onClick={() => initGame(true)} className="w-full bg-slate-900 border border-slate-700 text-slate-400 py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition-all">
                                            Spectate
                                        </button>
                                    </div>

                                    {/* Path 3: Simulation */}
                                    <div className="text-left">
                                        <button
                                            onClick={() => setShowAdvanced(!showAdvanced)}
                                            className="text-xs font-bold text-slate-600 uppercase tracking-widest mb-4 ml-1 flex items-center gap-2 hover:text-slate-400 transition-colors"
                                        >
                                            Advanced mode {showAdvanced ? '▼' : '▶'}
                                        </button>

                                        {showAdvanced && (
                                            <div className="bg-slate-900/50 p-6 rounded-2xl border border-slate-800 space-y-4 animate-fade-in">
                                                <div className="flex items-center justify-between">
                                                    <label className="text-sm font-bold text-slate-400">Number of games:</label>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        max="2000"
                                                        value={simCount}
                                                        onChange={(e) => setSimCount(Math.min(2000, Math.max(1, parseInt(e.target.value, 10) || 1)))}
                                                        className="w-24 bg-slate-900 border border-slate-700 rounded-xl p-2 text-center text-white focus:outline-none focus:border-blue-500"
                                                    />
                                                </div>
                                                <button onClick={startSimulationWithCount} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl font-bold transition-all border border-slate-700 text-sm">
                                                    Simulate
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {(gameState === 'bidding' || gameState === 'playing' || gameState === 'roundEnd') && players.length > 0 && (
                        <div className="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-8">
                            {/* Left: Table & Hand */}
                            <div className="lg:col-span-3 flex flex-col">
                                <HUD players={players} round={round} maxRounds={maxRounds} trumpCard={trumpCard} trumpSuit={trumpSuit} playerBid={players[0].bid} playerTricks={players[0].tricks} />

                                <div className="flex-1 bg-slate-900/50 rounded-3xl border border-slate-800 relative flex items-center justify-center p-8 min-h-[300px]">
                                    <div className="flex flex-wrap justify-center gap-4">
                                        {currentTrick.map((t, i) => (
                                            <div key={`${t.pIdx}-${i}`} className="flex flex-col items-center animate-fade-in">
                                                <Card card={t.card} disabled size="sm" />
                                                <span className="text-[10px] font-bold text-slate-400 mt-2">{players[t.pIdx]?.name}</span>
                                            </div>
                                        ))}
                                        {currentTrick.length === 0 && (
                                            <p className="text-slate-600 italic">
                                                {spectatorMode ? `Waiting for ${players[turn]?.name}...` : (turn === 0 ? 'Play a card to start the trick' : `Waiting for ${players[turn]?.name}...`)}
                                            </p>
                                        )}
                                    </div>
                                    <div className="absolute top-4 right-4 flex gap-2 items-center">
                                        <button 
                                            onClick={() => setShowRules(true)} 
                                            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-full text-xs font-bold transition-all border border-slate-700"
                                        >
                                            Rules ℹ️
                                        </button>
                                        {(gameState === 'playing' || spectatorMode) && (
                                            <button onClick={() => setFastForward(!fastForward)} className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${fastForward ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                                {fastForward ? '⏩ Fast mode' : '🐢 Normal speed'}
                                            </button>
                                        )}
                                        <button onClick={() => setIsPaused(true)} aria-label="Pause game" className="p-2 bg-slate-800 rounded-full hover:bg-slate-700 transition-colors">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        </button>
                                    </div>
                                </div>

                                {/* Hand Area */}
                                <div className="mt-8">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-sm font-bold text-slate-400 tracking-widest">
                                            {spectatorMode ? `${players[0].name}'s hand` : 'Your hand'}
                                        </h3>
                                        <span className="text-xs text-slate-500">{players[0].hand.length} card{players[0].hand.length !== 1 ? 's' : ''} remaining</span>
                                    </div>
                                    <div className="flex flex-wrap gap-2 justify-center">
                                        {players[0].hand.map((c, i) => (
                                            <Card
                                                key={`${c.type}-${c.suit}-${c.value}-${i}`}
                                                card={c}
                                                disabled={spectatorMode || gameState !== 'playing' || turn !== 0 || trickComplete || !isValidPlay(c, players[0].hand, leadSuit)}
                                                onClick={() => executePlay(0, i)}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Right: Scores & Logs */}
                            <div className="flex flex-col gap-6">
                                <ScoreBoard players={players} currentTurn={turn} />
                                <div className="flex-1 bg-slate-900/80 rounded-xl border border-slate-800 p-4 overflow-y-auto max-h-[300px] lg:max-h-none">
                                    <h3 className="text-xs font-bold text-slate-500 mb-4">Recent events</h3>
                                    <div className="space-y-3">
                                        {logs.map((log, i) => (
                                            <p key={i} className="text-sm text-slate-300 leading-tight border-l-2 border-slate-700 pl-3">{log}</p>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Overlays */}
                    {gameState === 'bidding' && !spectatorMode && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-40 flex items-center justify-center p-6">
                            <div className="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-lg w-full text-center shadow-2xl animate-fade-in">
                                <h2 className="text-3xl font-bold mb-2">Place your bid</h2>
                                <p className="text-slate-400 mb-3">How many tricks will you take in round {round}?</p>
                                <p className="text-xs text-slate-500 mb-6">
                                    Trump: <strong className="text-slate-200">{trumpSuit === 'None' ? 'No trump' : `${SUIT_ICONS[trumpSuit]} ${trumpSuit}`}</strong>
                                    {' • '}Your hand: <strong className="text-slate-200">{players[0]?.hand.map(c => `${getCardDisplay(c)}${getCardIcon(c)}`).join('  ')}</strong>
                                </p>
                                <div className="grid grid-cols-4 md:grid-cols-6 gap-3">
                                    {Array.from({ length: round + 1 }, (_, i) => (
                                        <button key={i} onClick={() => handleBid(i)} className="bg-slate-800 hover:bg-blue-600 p-4 rounded-xl font-bold text-lg transition-all active:scale-95 border border-slate-700">
                                            {i}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState === 'roundEnd' && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-40 flex items-center justify-center p-6 text-center">
                            <div className="bg-slate-900 border border-slate-700 p-10 rounded-3xl max-w-md w-full shadow-2xl animate-fade-in">
                                <h2 className="text-4xl font-bold mb-4">Round {round} results</h2>
                                <div className="space-y-3 mb-8">
                                    {players.map(p => (
                                        <div key={p.id} className="flex justify-between items-center bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                                            <span className="font-medium">{p.name} ({p.tricks} / {p.bid})</span>
                                            <span className={`font-bold ${p.tricks === p.bid ? 'text-green-500' : 'text-red-500'}`}>
                                                {p.tricks === p.bid ? `+${20 + p.tricks * 10}` : -(Math.abs(p.tricks - p.bid) * 10)} pts
                                            </span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={nextRound} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold text-lg transition-all active:scale-95">
                                    {round >= maxRounds ? 'View final standings' : 'Next round'}
                                </button>
                            </div>
                        </div>
                    )}

                    {gameState === 'gameEnd' && (
                        <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-40 flex items-center justify-center p-6 text-center">
                            <div className="bg-slate-900 border border-slate-700 p-12 rounded-3xl max-w-lg w-full shadow-2xl border-t-4 border-t-blue-500 animate-fade-in">
                                <h2 className="text-5xl font-black mb-2 italic">Finita la commedia</h2>
                                <p className="text-slate-400 mb-8">The magic has faded. Here is the final standing.</p>
                                <div className="space-y-4 mb-10">
                                    {[...players].sort((a, b) => b.score - a.score).map((p, i) => (
                                        <div key={p.id} className={`flex justify-between items-center p-4 rounded-2xl ${i === 0 ? 'bg-blue-600/20 border border-blue-500/30' : 'bg-slate-800/50 border border-slate-700'}`}>
                                            <span className="text-lg font-bold">{i + 1}. {p.name}</span>
                                            <span className="text-2xl font-black">{p.score}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={returnToMenu} className="w-full bg-white text-slate-950 py-4 rounded-2xl font-black text-xl hover:bg-slate-200 transition-all active:scale-95">Play again</button>
                            </div>
                        </div>
                    )}

                    {gameState === 'simulationResults' && simulationStats && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-40 flex items-center justify-center p-6 text-center">
                            <div className="bg-slate-900 border border-slate-700 p-10 rounded-3xl max-w-lg w-full shadow-2xl animate-fade-in">
                                <h2 className="text-3xl font-bold mb-2">Simulation results</h2>
                                <p className="text-slate-400 mb-8 font-medium">Win counts over {lastSimulatedCount} simulated game{lastSimulatedCount === 1 ? '' : 's'}.</p>
                                <div className="space-y-4 mb-10">
                                    {Object.entries(simulationStats).sort((a, b) => b[1] - a[1]).map(([name, wins]) => (
                                        <div key={name} className="flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                                            <span className="font-bold">{name}</span>
                                            <div className="flex items-center gap-4">
                                                <div className="w-32 h-3 bg-slate-700 rounded-full overflow-hidden">
                                                    <div className="h-full bg-blue-500" style={{ width: `${(wins / Math.max(1, lastSimulatedCount)) * 100}%` }}></div>
                                                </div>
                                                <span className="text-xl font-bold">{wins}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setGameState('start')} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-2xl font-bold text-lg transition-all active:scale-95">Back to menu</button>
                            </div>
                        </div>
                    )}

                    {isPaused && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-6">
                            <div className="bg-slate-900 border border-slate-700 p-10 rounded-3xl max-w-sm w-full text-center animate-fade-in">
                                <h2 className="text-3xl font-bold mb-8">Game paused</h2>
                                <div className="flex flex-col gap-4">
                                    <button onClick={() => setIsPaused(false)} className="bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold transition-all active:scale-95">Resume game</button>
                                    <button onClick={returnToMenu} className="bg-slate-800 hover:bg-slate-700 text-slate-300 py-4 rounded-2xl font-bold transition-all">Quit to menu</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <RulesModal isOpen={showRules} onClose={() => setShowRules(false)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
