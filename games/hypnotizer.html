        html,

        canvas {
            display: block;

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px #fff;
        }

        .scheme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            max-width: 600px;
        }

        @media(min-width: 600px) {
            .scheme-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        button {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-transform: uppercase;
        }

        button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }

            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            padding: 8px 16px;
            font-size: 0.9rem;

            display: none;

        #menu-btn:hover {
